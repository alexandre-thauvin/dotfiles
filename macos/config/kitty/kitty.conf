# kitty -- macOS
#
# Editing keys follow the macOS convention rather than the Linux one:
#   cmd+c / cmd+v        copy / paste
#   ctrl+c               cancel (deliberately NOT mapped, so it reaches the tty
#                        as SIGINT -- this is why the old `stty intr '^E'` from
#                        the nushell config is gone)
#   alt+left / right     previous / next word
#   cmd+left / right     start / end of line
#   alt+bksp             delete previous word
#   cmd+bksp             delete the whole line
#   alt+delete           delete next word
#   cmd+delete           delete to end of line
#   shift+arrow          extend the selection by a character
#   alt+shift+arrow      extend the selection by a word
#   cmd+shift+arrow      extend the selection to the start / end of the line
#   cmd+x                cut the selection
#
# The control sequences below are the standard emacs-mode readline/zle ones, so
# the same keys work in zsh, bash, psql, python -- and over ssh.

# ------------------------------------------------------------------------ shell
# Pinned rather than left to kitty's default of "whatever the user's shell is".
# kitty resolves that from the inherited $SHELL, and GUI apps on macOS inherit
# their environment from the login session -- which keeps the shell it had when
# you logged in. After `chsh`, every GUI-launched app therefore keeps opening the
# OLD shell until the next logout or reboot. Naming it here makes kitty immune.
shell /bin/zsh

# ------------------------------------------------------------ clipboard (cmd)
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# Kept as secondary bindings out of Linux habit.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

copy_on_select yes

# ------------------------------------------------------- line start/end (cmd)
map super+left  send_text all \x01
map super+right send_text all \x05

# ------------------------------------------------------- word movement (alt)
map alt+left  send_text all \x1b\x62
map alt+right send_text all \x1b\x66

# ctrl+left / ctrl+right are intentionally left unmapped: kitty then sends its
# default CSI 1;5D / 1;5C, which common/config/zsh/keybindings.zsh also binds to
# word movement. Handy as a second option, and it keeps the Arch muscle memory.

# ------------------------------------------------------------------- deletion
# Backwards, with backspace.
map alt+backspace   send_text all \x17
map super+backspace send_text all \x15
map ctrl+backspace  send_text all \x15

# Forwards, with delete (fn+backspace on a laptop keyboard).
map alt+delete   send_text all \x1b\x64
map super+delete send_text all \x0b

# ---------------------------------------------------------- selection (shift)
# kitty has no idea what a "selection" is here -- these keys only carry a
# distinct control sequence across to the shell, and common/config/zsh/
# keybindings.zsh turns each one into a zle widget that extends the highlighted
# region. The numbers are the standard xterm modifier encoding, 1 + shift(1) +
# alt(2) + ctrl(4) + super(8), so shift+alt is 4 and shift+super is 10.
#
# shift+left/right is spelled out even though kitty's own default already emits
# CSI 1;2D / 1;2C, so the whole family is pinned in one place rather than half
# of it resting on a default that could change.
map shift+left        send_text all \x1b[1;2D
map shift+right       send_text all \x1b[1;2C
map alt+shift+left    send_text all \x1b[1;4D
map alt+shift+right   send_text all \x1b[1;4C
map super+shift+left  send_text all \x1b[1;10D
map super+shift+right send_text all \x1b[1;10C

# Cut, and a copy that works on the *shell's* selection -- super+c above is
# already spoken for by kitty's own mouse selection. Both use the CSI-u form
# (codepoint ; modifier u), 120 being 'x' and 99 'c'.
map super+x       send_text all \x1b[120;9u
map super+shift+c send_text all \x1b[99;10u

# --------------------------------------------- tab / window navigation (ctrl+alt)
# ctrl+option+left/right cycles tabs, ctrl+option+up/down cycles the splits inside
# the current tab. Plain alt+left/right stays word movement (see above), so the
# ctrl modifier is what keeps these two families apart.
map ctrl+alt+left  previous_tab
map ctrl+alt+right next_tab
map ctrl+alt+up    previous_window
map ctrl+alt+down  next_window

# --------------------------------------------------------------- appearance
# No font_family is set on purpose -- kitty's default plus per-glyph fallback to
# the installed Nerd Fonts renders the starship powerline. If separators or icons
# ever show as boxes, uncomment the line below.
# font_family Hack Nerd Font Mono
font_size 15.0

background_opacity 0.7
